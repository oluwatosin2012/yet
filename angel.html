<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>
<body>
    <form>
        <h1>REGISTRATION FORM</h1>
        <label for="name">Your Name</label>
<input id="name"name="name" type="text"required>
<label for="email">Your Email</label>
<input id="email" name="email" type="email"required>
<button type="submit">join</button>
    </form>
    <form>
        <h2>REGISTRATION FORM</h2>
         <label for="name">Your Name</label>
         <input id="name" name="name" type="name" placeholder="Your Name" autocomplete="name" required>
         <label for="email">Your Email</label>
    <input id="email" name="email" type="email" placeholder="Your Email" autocomplete="email"required>
<button type="submit">join</button>
    </form>
    <style>
        form{
            background-color: rgb(163, 92, 177);
            width: 350px;
            margin: 80px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1{
    color: brown;
    font-family: Arial, Helvetica, sans-serif;
}
h2{
    color: rgb(13, 33, 211);
   font-family: Arial, Helvetica, sans-serif;
font-size: 30px;
}
label{
    display: block;
    font-size: 15px;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
}
input{
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    box-sizing: border-box;
}
   input:focus{
    outline: none;
    border: 2px solid #247c62
   }
button{
    width: 100%;
    padding: 13px;
    background-color: rgb(224, 3, 3);
    color: white;
    border: none;
    border-radius: 21px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
button hover{

}
    </style>
</body>
</html>
